services:
  polywatch:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-45}"
      DATA_FILE_PATH: "/data/polywatch.json"
    volumes:
      - polywatch-data:/data

volumes:
  polywatch-data:
